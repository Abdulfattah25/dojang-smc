name = "taekwondo-registration-app"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# Binding Database Cloudflare D1 (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "taekwondo-db"
database_id = "61509471-08ab-44a7-b24a-c8ba5e878fad"

# Binding Object Storage Cloudflare R2
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "taekwondo-docs"

# Variabel Lingkungan (Gunakan 'wrangler secret put JWT_SECRET' untuk kunci rahasia produksi)
[vars]
ENVIRONMENT = "development"
MAX_UPLOAD_SIZE_MB = "2"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
